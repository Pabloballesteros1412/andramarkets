name: Daily market close

on:
  # 4:30 pm ET in summer (20:30 UTC) and in winter (21:30 UTC). Both fire
  # every weekday. A scheduled run reports only the session that closed that
  # day in New York: in winter the 20:30 UTC firing (3:30 pm ET) stops
  # without reporting anything, and a firing after the note went out stops
  # on the dedup marker.
  schedule:
    - cron: "30 20 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      resend:
        description: Send again even if this session's note was already sent
        type: boolean
        default: false
      demo:
        description: >-
          Demo run: synthetic data, no model call, no email, nothing committed
          or archived. Builds every file and the video, for testing.
        type: boolean
        default: false
      check:
        description: >-
          Check run: live data and the model, but no email (no mail secrets are
          passed), nothing committed or archived. For testing the writers.
        type: boolean
        default: false

permissions:
  contents: write

# One run at a time, so two firings never race on the publish marker.
concurrency:
  group: daily-close
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # Read by run_daily.py as --force: skips only the dedup gate.
      ANDRA_RESEND: ${{ inputs.resend || false }}
      # Demo runs name their artifacts andramarkets-demo-<run id>, which
      # neither archive.py nor the site's note importer picks up.
      ANDRA_DEMO: ${{ inputs.demo || false }}
      # Check runs name their artifacts andramarkets-check-<run id>, which
      # neither archive.py nor the site's importers pick up.
      ANDRA_CHECK: ${{ inputs.check || false }}
    defaults:
      run:
        working-directory: andramarkets-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: House fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-texgyre fonts-liberation2

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build and publish
        if: env.ANDRA_DEMO != 'true' && env.ANDRA_CHECK != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python run_daily.py

      - name: Build check edition
        # Live data and the model, no mail secrets and --no-mail: nothing is
        # sent, and --force only lets it rebuild a session already published.
        if: env.ANDRA_DEMO != 'true' && env.ANDRA_CHECK == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python run_daily.py --no-mail --force

      - name: Build demo edition
        # No secrets: a demo run makes no model call and sends no email.
        if: env.ANDRA_DEMO == 'true'
        run: python run_daily.py --demo --no-mail

      - name: Save publish state
        if: always() && env.ANDRA_DEMO != 'true' && env.ANDRA_CHECK != 'true'
        run: |
          git config user.name "andra-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f .edition ] && git add .edition
          [ -f .last_published ] && git add .last_published
          git diff --cached --quiet || git commit -m "Update publish state [skip ci]"
          git push

      - name: Archive permanently
        # Artifacts expire after 90 days. This keeps the PDF, fact pack, note
        # and chart data for good, as a release in this private repo.
        # A failure here only warns: it must never stop the next step from
        # uploading the artifact, or the run's files would exist nowhere.
        # Archive backfill copies the run later from that artifact.
        if: always() && env.ANDRA_DEMO != 'true' && env.ANDRA_CHECK != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python archive.py out || echo "::warning::Permanent archive failed for this run. Run Actions > Archive backfill before its artifact expires in 90 days."

      - name: Archive the edition
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDRA_DEMO == 'true' && 'andramarkets-demo' || env.ANDRA_CHECK == 'true' && 'andramarkets-check' || 'andramarkets' }}-${{ github.run_id }}
          path: andramarkets-agent/out/

      - name: Publish on the site
        # Starts the site's Publish close notes workflow, which imports the
        # artifact uploaded just above, so the note goes live in minutes
        # instead of at the site's next half-hourly check. Only for a run that
        # produced a note; demo and check runs never reach the site.
        # SITE_DISPATCH_TOKEN: fine-grained token on andramarkets-site only,
        # with Actions: Read and write. Without it the site's schedule still
        # picks the note up, and this step only warns.
        if: env.ANDRA_DEMO != 'true' && env.ANDRA_CHECK != 'true'
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if ! ls out/AndraMarkets_Close_*.pdf >/dev/null 2>&1; then
            echo "No note built in this run: nothing to publish."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set: the site will pick the note up on its next scheduled check."
            exit 0
          fi
          gh api -X POST repos/Pabloballesteros1412/andramarkets-site/actions/workflows/publish-notes.yml/dispatches \
            -f ref=main >/dev/null \
            && echo "Started Publish close notes on andramarkets-site." \
            || echo "::warning::Could not start Publish close notes on andramarkets-site; the site will pick the note up on its next scheduled check."

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install video dependencies
        id: video_deps
        continue-on-error: true
        working-directory: andramarkets-agent/video
        run: npm install

      - name: Build data and render video
        id: video
        continue-on-error: true
        working-directory: andramarkets-agent/video
        run: |
          python build_video_data.py
          echo "--- files in video dir ---"
          ls -la
          npx remotion render src/index.js DailyRecap out/video.mp4 --props="./video-data.json"

      - name: Upload video
        id: video_upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ANDRA_DEMO == 'true' && 'andra-video-demo' || 'andra-video' }}-${{ github.run_id }}
          path: andramarkets-agent/video/out/video.mp4
          if-no-files-found: error

      - name: Report the video step
        # The video steps may fail without failing the run, but never
        # silently: a failure shows as a warning on the run and in its summary.
        if: always()
        env:
          DEPS: ${{ steps.video_deps.outcome }}
          RENDER: ${{ steps.video.outcome }}
          UPLOAD: ${{ steps.video_upload.outcome }}
        run: |
          if [ "$DEPS" = success ] && [ "$RENDER" = success ] && [ "$UPLOAD" = success ]; then
            echo "Video: rendered and uploaded ($(du -h video/out/video.mp4 | cut -f1))." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="Video step did not complete: install $DEPS, render $RENDER, upload $UPLOAD. The note itself is unaffected."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
