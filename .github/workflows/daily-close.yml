name: Daily market close

on:
  schedule:
    - cron: "20 20 * * 1-5"
    - cron: "20 21 * * 1-5"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: andramarkets-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: House fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-texgyre fonts-liberation2

      - name: Dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Build and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python run_daily.py

      - name: Archive the edition
        uses: actions/upload-artifact@v4
        with:
          name: andramarkets-${{ github.run_id }}
          path: andramarkets-agent/out/
