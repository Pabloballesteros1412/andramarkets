name: Render Andra video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: andramarkets-agent/video
        run: npm install

      - name: Render video
        working-directory: andramarkets-agent/video
        run: npx remotion render src/index.js DailyRecap out/video.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: andra-video
          path: andramarkets-agent/video/out/video.mp4
